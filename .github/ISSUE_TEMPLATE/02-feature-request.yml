name: "Feature request"
description: "Propose new functionality. Alternatives + why are required — pick this template only after you've considered other paths."
title: "feat: <one-line summary>"
type: Feature
body:
  - type: checkboxes
    id: pre-check
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched the existing issues and this is not a duplicate.
          required: true

  - type: textarea
    id: context
    attributes:
      label: Context / problem
      description: What problem are you trying to solve? State the problem before the solution.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: Concrete behavior, API shape, or config — not a vague direction.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List at least one alternative you rejected and why.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why this approach
      description: Rationale and tradeoffs against the alternatives above.
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Plan
      description: |
        Checkbox list of work steps. GitHub shows N/M completed in the
        issue header. /workflow:handle-issue ticks these as work
        progresses; /spec-driven-development output can be inlined
        verbatim here for full context. Leave blank if no plan exists
        yet — a prefilled `value:` would make untouched submissions
        show a misleading "0/2 complete".
      placeholder: |
        - [ ] step 1
        - [ ] step 2

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: |
        Checkbox list of outcome conditions (distinct from Plan above —
        Plan is the steps to get there, Acceptance is how we know we're
        done). GitHub shows N/M completed in the issue header.
      placeholder: |
        - [ ] criterion 1
        - [ ] criterion 2

  - type: textarea
    id: references
    attributes:
      label: References
      description: Links to prior PRs, papers, design docs, related issues.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: |
        Which part of the system this belongs to. The
        /workflow:create-issue skill maps the pick to an `area:*` label;
        a repo may define finer areas (e.g. riscv-witness `area:sp1`) in
        its own templates.
        - `zkvm` — vendor / version / subphase (SP1, OpenVM, ZisK)
        - `compiler` — zk compiler stack (zk_dtypes, prime_ir, stablehlo, zkx, jax fork)
        - `downstream` — proof generator / partner consumer
        - `tooling` — build / CI / dev infra
      options:
        - "none / unsure"
        - zkvm
        - compiler
        - downstream
        - tooling
    validations:
      required: false

  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: |
        Issue number or full URL of the tracking / parent issue this
        work is a sub-task of. Same-repo form: `#1234`. Cross-repo form:
        `https://github.com/<owner>/<repo>/issues/1234`. The
        /workflow:create-issue skill registers the sub-issue link
        automatically when filed via the CLI.
      placeholder: "#1234 or https://github.com/<owner>/<repo>/issues/1234"

  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: |
        Existing milestone name to attach this issue to. The
        /workflow:create-issue skill checks the milestone exists before
        applying it.
      placeholder: "e.g. zisk: subphase 1 harness"

  - type: textarea
    id: knowledge
    attributes:
      label: Relevant knowledge
      description: |
        Wiki link or sanitized excerpt from personal notes. The /create-issue
        skill bundles this automatically; if you're filing from the web UI,
        leave blank or paste manually.
