name: "Bug report"
description: "Something broke. File a reproducer the next engineer can run."
title: "fix: <one-line summary>"
labels: ["type:fix"]
body:
  - type: checkboxes
    id: pre-check
    attributes:
      label: Pre-submission checklist
      options:
        - label: I have searched the existing issues and this is not a duplicate.
          required: true

  - type: input
    id: version
    attributes:
      label: Affected version / commit
      description: Plugin version, semver tag, or git SHA — whichever is meaningful for this repo.
      placeholder: "e.g. v1.0.0 or 80e2e121"
    validations:
      required: true

  - type: dropdown
    id: env
    attributes:
      label: Environment
      options:
        - Linux
        - macOS
        - Windows
        - CI
        - Other (describe in Actual behavior)
    validations:
      required: true

  - type: textarea
    id: reproducer
    attributes:
      label: Reproducer
      description: |
        Minimum commands or input that reproduce the issue. Use build-tool
        `run` invocations (e.g. `bazel run`, `cargo run`), not built binary
        paths. Prefix file inputs with `$PWD`.
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen? One concrete sentence is enough.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Stdout / stderr excerpts go in "Relevant logs" below, not here.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      description: Excerpts only — no scratch-dir paths or absolute home-dir paths the reviewer cannot open.
      render: text

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: |
        Which part of the system this belongs to. The
        /workflow:create-issue skill maps the pick to an `area:*` label;
        a repo may define finer areas (e.g. riscv-witness `area:sp1`) in
        its own templates.
        - `zkvm` — vendor / version / subphase (SP1, OpenVM, ZisK)
        - `compiler` — zk compiler stack (zk_dtypes, prime_ir, stablehlo, zkx, jax fork)
        - `downstream` — proof generator / partner consumer
        - `tooling` — build / CI / dev infra
      options:
        - "none / unsure"
        - zkvm
        - compiler
        - downstream
        - tooling
    validations:
      required: false

  - type: input
    id: parent
    attributes:
      label: Parent issue
      description: |
        Issue number or full URL of the tracking / parent issue this bug
        belongs to, if any. Same-repo form: `#1234`. Cross-repo form:
        `https://github.com/<owner>/<repo>/issues/1234`. The
        /workflow:create-issue skill registers the sub-issue link
        automatically when filed via the CLI.
      placeholder: "#1234 or https://github.com/<owner>/<repo>/issues/1234"

  - type: input
    id: milestone
    attributes:
      label: Milestone
      description: |
        Existing milestone name to attach this bug to. Leave blank for
        one-off bugs that don't belong to a milestone.
      placeholder: "e.g. sp1: v5.0.0"

  - type: textarea
    id: knowledge
    attributes:
      label: Relevant knowledge
      description: |
        Wiki link or sanitized excerpt from personal notes. The /create-issue
        skill bundles this automatically; if you're filing from the web UI,
        leave blank or paste manually.
