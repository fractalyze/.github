name: check-test-budgets action

on:
  pull_request:
    paths:
      - '.github/actions/check-test-budgets/**'
      - '.github/workflows/check-test-budgets-action.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .github/actions/check-test-budgets
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Neither of these is the action's. It imports only the standard library,
      # so a consuming runner installs nothing: absl belongs to the test
      # harness and pyyaml to the definition check below. Keeping that straight
      # matters — a dependency added here reads as one the consumers inherit.
      - name: Install what this workflow needs
        run: pip install absl-py pyyaml

      - name: Run the checker's tests
        env:
          PYTHONPATH: .
        run: python3 tests/check_test_budgets_test.py

      # A consuming repo discovers a malformed action.yml only when its own CI
      # run fails, in a repo whose maintainer did not write it.
      - name: The action definition parses
        run: python3 -c "import yaml,sys; yaml.safe_load(open('action.yml')); print('action.yml ok')"
